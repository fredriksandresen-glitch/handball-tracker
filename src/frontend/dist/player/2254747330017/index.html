    <script>
      (() => {
        const root = document.documentElement;
        root.dataset.initialRoute = location.pathname === "/" ? "home" : "other";
        try {
          const saved = localStorage.getItem("handball-tracker-theme");
          const dark =
            saved === "dark" ||
            (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";

          const followed = JSON.parse(
            localStorage.getItem("handball-tracker-followed-player-ids") || "[]",
          );
          root.dataset.initialFollowed =
            Array.isArray(followed) && followed.length > 0 ? "true" : "false";
        } catch {
          root.dataset.initialFollowed = "false";
        }
      })();
    </script>
