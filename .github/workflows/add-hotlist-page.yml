name: Add hotlist page

on:
  push:
    branches:
      - codex/static-sarah-profile
    paths:
      - scripts/add-hotlist-page.cjs
      - scripts/.add-hotlist-page-trigger
      - .github/workflows/add-hotlist-page.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/static-sarah-profile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch hotlist
        run: node scripts/add-hotlist-page.cjs
      - name: Clean temporary files
        run: |
          rm -f scripts/add-hotlist-page.cjs
          rm -f scripts/.add-hotlist-page-trigger
          rm -f .github/workflows/add-hotlist-page.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/src/components/Layout.tsx src/frontend/src/pages/FavoritesPage.tsx scripts/add-hotlist-page.cjs scripts/.add-hotlist-page-trigger .github/workflows/add-hotlist-page.yml
          git commit -m "Replace favorites tab with hotlist"
          git push
