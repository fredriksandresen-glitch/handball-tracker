name: Add player comparison

on:
  push:
    branches:
      - codex/static-sarah-profile
    paths:
      - scripts/.add-player-comparison-trigger
      - scripts/add-player-comparison.cjs
      - .github/workflows/add-player-comparison.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-player-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/static-sarah-profile

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch player comparison UI
        run: node scripts/add-player-comparison.cjs

      - name: Clean up temporary workflow files
        run: |
          rm -f scripts/add-player-comparison.cjs
          rm -f scripts/.add-player-comparison-trigger
          rm -f .github/workflows/add-player-comparison.yml

      - name: Commit player comparison UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/src/pages/PlayerPage.tsx scripts/add-player-comparison.cjs scripts/.add-player-comparison-trigger .github/workflows/add-player-comparison.yml
          git commit -m "Add player comparison on profile pages" || exit 0
          git push
