name: Add search hot sort

on:
  push:
    branches:
      - codex/static-sarah-profile
    paths:
      - scripts/.add-search-hot-sort-trigger
      - scripts/add-search-hot-sort.cjs
      - .github/workflows/add-search-hot-sort.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-search-hot-sort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/static-sarah-profile

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch search hot sort UI
        run: node scripts/add-search-hot-sort.cjs

      - name: Clean up temporary workflow files
        run: |
          rm -f scripts/add-search-hot-sort.cjs
          rm -f scripts/.add-search-hot-sort-trigger
          rm -f .github/workflows/add-search-hot-sort.yml

      - name: Commit search hot sort UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/src/pages/SearchPage.tsx scripts/add-search-hot-sort.cjs scripts/.add-search-hot-sort-trigger .github/workflows/add-search-hot-sort.yml
          git commit -m "Add hot sorting and form curves to search" || exit 0
          git push
