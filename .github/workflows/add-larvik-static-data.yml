name: Add Larvik static data

on:
  push:
    branches:
      - codex/static-sarah-profile
    paths:
      - scripts/.add-larvik-static-data-trigger
      - scripts/add-larvik-static-data.cjs
      - .github/workflows/add-larvik-static-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-larvik-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/static-sarah-profile

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Larvik static data
        run: node scripts/add-larvik-static-data.cjs

      - name: Clean up temporary workflow files
        run: |
          rm -f scripts/add-larvik-static-data.cjs
          rm -f scripts/.add-larvik-static-data-trigger
          rm -f .github/workflows/add-larvik-static-data.yml

      - name: Commit generated Larvik data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/src/data/larvikRoster.json src/frontend/src/data/larvikPlayerStats.json src/frontend/src/services/clawdbotPlayerProfile.ts src/frontend/src/pages/PlayerPage.tsx scripts/add-larvik-static-data.cjs scripts/.add-larvik-static-data-trigger .github/workflows/add-larvik-static-data.yml
          git commit -m "Add Larvik roster and player stats" || exit 0
          git push
