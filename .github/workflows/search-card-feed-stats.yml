name: Update search card feed stats

on:
  push:
    branches:
      - codex/static-sarah-profile
    paths:
      - scripts/search-card-feed-stats.cjs
      - scripts/.search-card-feed-stats-trigger
      - .github/workflows/search-card-feed-stats.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/static-sarah-profile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch search cards
        run: node scripts/search-card-feed-stats.cjs
      - name: Clean temporary files
        run: |
          rm -f scripts/search-card-feed-stats.cjs
          rm -f scripts/.search-card-feed-stats-trigger
          rm -f .github/workflows/search-card-feed-stats.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/src/components/PlayerCard.tsx src/frontend/src/pages/SearchPage.tsx scripts/search-card-feed-stats.cjs scripts/.search-card-feed-stats-trigger .github/workflows/search-card-feed-stats.yml
          git commit -m "Show feed stats on search player cards"
          git push
