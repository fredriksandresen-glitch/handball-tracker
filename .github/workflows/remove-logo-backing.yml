name: Remove logo backing

on:
  push:
    branches:
      - codex/static-sarah-profile
    paths:
      - scripts/.remove-logo-backing-trigger
      - scripts/remove-logo-backing.cjs
      - .github/workflows/remove-logo-backing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-logo-backing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/static-sarah-profile

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove white logo backing
        run: node scripts/remove-logo-backing.cjs

      - name: Clean up temporary workflow files
        run: |
          rm -f scripts/remove-logo-backing.cjs
          rm -f scripts/.remove-logo-backing-trigger
          rm -f .github/workflows/remove-logo-backing.yml

      - name: Commit logo styling update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/src/pages/PlayerPage.tsx src/frontend/src/pages/TeamsPage.tsx src/frontend/src/pages/TeamPage.tsx src/frontend/src/components/TeamCard.tsx scripts/remove-logo-backing.cjs scripts/.remove-logo-backing-trigger .github/workflows/remove-logo-backing.yml
          git commit -m "Remove white backing from team logos" || exit 0
          git push
